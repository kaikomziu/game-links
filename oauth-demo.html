<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>かるわかGAMESでログイン(サンプル)</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0820; color: #eef; font: 15px/1.6 system-ui, "Yu Gothic UI", sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 440px; background: #17133a; border: 1px solid #2f2a66; border-radius: 16px; padding: 24px 22px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  button { font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 10px; border: 0; cursor: pointer; background: #6d5dfc; color: #fff; }
  button.sub { background: #2a2557; color: #dde; margin-top: 12px; }
  .me { font-size: 44px; }
  .name { font-size: 20px; font-weight: 700; }
  .muted { color: #99a; font-size: 12.5px; word-break: break-all; }
  .err { color: #fca5a5; }
  a { color: #8fd0ff; }
</style>
</head>
<body>
<main class="card" id="app"><p>読み込み中…</p></main>
<script>
/*
 * 「かるわかGAMESでログイン」のサンプル(認可コードフロー + PKCE)。
 * このファイルをそのままコピーして、CLIENT_ID と REDIRECT_URI を自分のものに変えれば、静的サイトでも使える。
 * 説明は developers.html。
 */
(function () {
  "use strict";
  var CLIENT_ID = "kaoc_demo_app";                                   // developers.html で登録したアプリのID
  var REDIRECT_URI = location.origin + location.pathname;            // 登録した「戻り先」と完全に同じ文字列にする
  var AUTHORIZE = "https://kaikomziu.github.io/game-links/authorize.html";
  var API = "https://kifnzvktwbomxthzvvgy.supabase.co/functions/v1/ka-oauth";
  var app = document.getElementById("app");

  function b64url(buf) {
    var s = ""; new Uint8Array(buf).forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function rand(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }
  function put(html) { app.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ① ログイン開始: verifier と state を作って保存し、認可画面へ
  async function login() {
    var verifier = rand(48);                       // 43〜128文字
    var state = rand(16);
    sessionStorage.setItem("ka_demo_verifier", verifier);
    sessionStorage.setItem("ka_demo_state", state);
    var challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    var u = new URL(AUTHORIZE);
    u.searchParams.set("response_type", "code");
    u.searchParams.set("client_id", CLIENT_ID);
    u.searchParams.set("redirect_uri", REDIRECT_URI);
    u.searchParams.set("state", state);
    u.searchParams.set("code_challenge", challenge);
    u.searchParams.set("code_challenge_method", "S256");
    location.href = u.href;
  }

  // ② 戻ってきたら: state を確かめて、code を access_token に交換 → userinfo
  async function finish(q) {
    var err = q.get("error");
    if (err) return put('<h1>ログインしませんでした</h1><p class="muted">' + esc(err) + '</p><button id="go">もう一度</button>');
    if (q.get("state") !== sessionStorage.getItem("ka_demo_state")) return put('<h1>ログインに失敗</h1><p class="err">state が一致しません(別のタブ・古いページかもしれません)。</p><button id="go">もう一度</button>');
    var verifier = sessionStorage.getItem("ka_demo_verifier");
    sessionStorage.removeItem("ka_demo_verifier"); sessionStorage.removeItem("ka_demo_state");
    history.replaceState(null, "", location.pathname); // code を履歴に残さない
    var body = new URLSearchParams({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT_URI, client_id: CLIENT_ID, code_verifier: verifier || "" });
    var tr = await fetch(API + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body });
    var t = await tr.json();
    if (!t.access_token) return put('<h1>ログインに失敗</h1><p class="err">' + esc(t.error || "error") + '</p><button id="go">もう一度</button>');
    var ur = await fetch(API + "/userinfo", { headers: { Authorization: "Bearer " + t.access_token } });
    var me = await ur.json();
    // ここで me.sub を「このアプリ内のユーザーID」として使う(ユーザー名や表示名は変わることがある)
    put('<div class="me">' + esc(me.avatar) + '</div><div class="name">' + esc(me.name) + '</div>' +
        '<p class="muted">@' + esc(me.preferred_username) + '<br>sub: ' + esc(me.sub) + '</p>' +
        '<p>ログインできました。</p><button class="sub" id="out">ログアウト(この画面だけ)</button>');
    document.getElementById("out").onclick = function () { location.href = location.pathname; };
  }

  var q = new URLSearchParams(location.search);
  if (q.get("code") || q.get("error")) {
    finish(q).catch(function () { put('<h1>ログインに失敗</h1><p class="err">通信できませんでした。</p><button id="go">もう一度</button>'); bind(); });
  } else {
    put('<h1>かるわかGAMESでログイン(サンプル)</h1><p>かるわかGAMESのアカウントで、このページにログインします。</p><button id="go">かるわかGAMESでログイン</button><p class="muted"><a href="developers.html">自分のサイトにも付ける方法</a></p>');
  }
  function bind() { var g = document.getElementById("go"); if (g) g.onclick = login; }
  bind();
  new MutationObserver(bind).observe(app, { childList: true });
})();
</script>
</body>
</html>
